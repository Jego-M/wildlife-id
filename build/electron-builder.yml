appId: org.wildlifeid.app
productName: Wildlife ID
icon: assets/icon.png
directories:
  output: dist/installers

files:
  - dist/main/**
  - dist/renderer/**
  - package.json

extraResources:
  - from: dist/backend/wildlife_backend
    to: backend
    filter: ["**/*"]

mac:
  target: dmg
  category: public.app-category.education
  identity: null  # unsigned

win:
  target: nsis
  signAndEditExecutable: false  # unsigned

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Education

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

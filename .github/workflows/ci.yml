name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Install Python lint tools
        run: pip install ruff

      - name: Python lint
        run: ruff check src/backend/

      - name: Run TypeScript tests
        run: npm test

  # Verify the backend builds successfully on Linux.
  # We only run this on main pushes (not every PR) since it takes ~5 min.
  build-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Build backend
        shell: bash
        run: npm run build:backend

      - name: Build renderer and main
        run: npm run build

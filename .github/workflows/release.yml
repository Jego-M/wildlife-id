name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      # build_backend.sh creates .venv-build with CPU-only torch on first run.
      # The script auto-detects the right python path on each OS.
      - name: Build Python backend
        shell: bash
        run: npm run build:backend

      - name: Build renderer and main process
        run: npm run build

      - name: Package installer
        run: npx electron-builder --${{ matrix.platform }} --config build/electron-builder.yml
        env:
          # Disable code signing — we ship unsigned binaries.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate third-party licenses
        shell: bash
        run: bash build/generate_third_party_licenses.sh

      - name: Compute checksums (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist/installers
          # Hash only top-level files (skip electron-builder's *-unpacked/ dirs)
          find . -maxdepth 1 -type f \
            \( -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.zip" \) \
            -exec sha256sum {} \; > SHA256SUMS.txt

      - name: Compute checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist/installers
          Get-ChildItem -File -Include *.exe -Recurse:$false | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # Only upload the installer files themselves — electron-builder also
          # produces *-unpacked/ directories and intermediate yml/blockmap files
          # that we don't want attached to the release.
          path: |
            dist/installers/*.AppImage
            dist/installers/*.deb
            dist/installers/*.dmg
            dist/installers/*.zip
            dist/installers/*.exe
            dist/installers/SHA256SUMS.txt
            THIRD_PARTY_LICENSES.txt
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/SHA256SUMS.txt
            artifacts/**/THIRD_PARTY_LICENSES.txt
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
